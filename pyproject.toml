[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agarwood-minims"
version = "0.1.5"
description = "Reproducible mass-spectrum classification for agarwood research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "AgarwoodMiniMS contributors"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "scikit-learn>=1.4,<2", "joblib>=1.3,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
agarwood-minims = "agarwood_minims.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
